services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-builder
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      # 安全建议：使用 MySQL 初始化时创建的专用用户（如 app_user），而非 root
      - DB_USER=${DB_USER:-app_user}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - DB_NAME=${DB_NAME:-star_citizen_promotion}
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./server/data:/app/server/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3001/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${DB_PASSWORD:-changeme}}
      MYSQL_DATABASE: ${DB_NAME:-star_citizen_promotion}
      # 初始化时创建专用应用用户，避免使用 root 账户
      MYSQL_USER: ${DB_USER:-app_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme}
    # 安全加固：MySQL 端口仅绑定到 127.0.0.1，防止公网直接访问
    # 如需从宿主机外部访问，请通过 SSH 隧道或 VPN
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 可选：挂载自定义初始化 SQL 脚本（如需要创建额外用户或权限）
      # - ./server/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 生产环境：使用 nginx 作为反向代理
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dist:/usr/share/nginx/html:ro
      # SSL 证书挂载路径（生产环境需将证书放置到以下路径）
      - ./ssl:/etc/nginx/ssl:ro
      # Let's Encrypt ACME 挑战路径
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - production

volumes:
  mysql_data:

  # ============================================
  # 数据库自动备份（生产环境）
  # 每天凌晨 3 点备份，保留 30 天
  # 启动: docker-compose --profile production up -d backup
  # 恢复: gunzip < backups/backup_YYYYMMDD_HHMMSS.sql.gz | docker-compose exec -T mysql mysql -u root -p"$DB_ROOT_PASSWORD" "$DB_NAME"
  # ============================================
  backup:
    image: mysql:8.0
    restart: unless-stopped
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c '
      echo "📦 数据库备份服务已启动，每天凌晨 3 点执行备份"
      while true; do
        # 等待到凌晨 3 環
        sleep $$(($$(( $$(date -d "tomorrow 03:00" +%s) - $$(date +%s) )) % 86400 + 86400 % 86400))
        TIMESTAMP=$$(date +%Y%m%d_%H%M%S)
        echo "🔄 开始备份: $$TIMESTAMP"
        mysqldump -h mysql -u root -p"$${DB_ROOT_PASSWORD}" \
          --single-transaction --routines --triggers --all-databases \
          | gzip > /backups/backup_$${TIMESTAMP}.sql.gz \
          && echo "✅ 备份完成: backup_$${TIMESTAMP}.sql.gz" \
          || echo "❌ 备份失败"
        # 保留最近 30 天备份
        find /backups -name "backup_*.sql.gz" -mtime +30 -delete
        echo "🗑️ 已清理 30 天前的备份"
      done'
    environment:
      - DB_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-${DB_PASSWORD:-changeme}}
      - DB_NAME=${DB_NAME:-star_citizen_promotion}
    depends_on:
      mysql:
        condition: service_healthy
    profiles:
      - production

  # ============================================
  # SSL 证书自动续期（生产环境）
  # 每 12 小时检查一次证书续期
  # 首次申请: docker-compose run --rm certbot certonly --webroot -w /var/www/certbot -d your-domain.com --email your@email.com --agree-tos --no-eff-email
  # ============================================
  certbot:
    image: certbot/certbot:v2.6.0
    restart: unless-stopped
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./ssl:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done'"
    profiles:
      - production
