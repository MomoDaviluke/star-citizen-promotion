services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-builder
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-app_user}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - DB_NAME=${DB_NAME:-star_citizen_promotion}
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./server/data:/app/server/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3001/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${DB_PASSWORD:-changeme}}
      MYSQL_DATABASE: ${DB_NAME:-star_citizen_promotion}
      MYSQL_USER: ${DB_USER:-app_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dist:/usr/share/nginx/html:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - production

  backup:
    image: mysql:8.0
    restart: unless-stopped
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c '
      echo "Database backup service started"
      while true; do
        sleep 86400
      done'
    environment:
      - DB_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-${DB_PASSWORD:-changeme}}
      - DB_NAME=${DB_NAME:-star_citizen_promotion}
    depends_on:
      mysql:
        condition: service_healthy
    profiles:
      - production

  certbot:
    image: certbot/certbot:v2.6.0
    restart: unless-stopped
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./ssl:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done'"
    profiles:
      - production

volumes:
  mysql_data:
