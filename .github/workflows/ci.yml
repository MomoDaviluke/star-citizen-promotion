name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: 代码检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 安装前端依赖
        run: npm ci

      - name: 运行前端 ESLint
        run: npm run lint

      - name: 安装后端依赖
        working-directory: ./server
        run: npm ci

      - name: 运行后端 ESLint
        working-directory: ./server
        run: npm run lint

  test-frontend:
    name: 前端测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 运行测试
        run: npm run test:coverage

      - name: 上传覆盖率报告
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  test-backend:
    name: 后端测试
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 安装后端依赖
        working-directory: ./server
        run: npm ci

      - name: 等待 MySQL 就绪
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -u root -ptest_password --silent; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 1
          done

      - name: 运行后端测试
        working-directory: ./server
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: test_password
          DB_NAME: test_db
          JWT_SECRET: test-secret-key-with-at-least-32-characters
          NODE_ENV: test
          NODE_OPTIONS: --experimental-vm-modules
        run: npm test -- --runInBand --forceExit

      - name: 上传覆盖率报告
        uses: codecov/codecov-action@v4
        with:
          files: ./server/coverage/lcov.info
          flags: backend
          fail_ci_if_error: false

  build:
    name: 构建检查
    runs-on: ubuntu-latest
    needs: [lint, test-frontend, test-backend, security-scan]
    if: always() && needs.lint.result == 'success' && needs.test-frontend.result == 'success' && needs.test-backend.result == 'success' && needs.security-scan.result == 'success'
    # 安全扫描失败时阻断构建部署，防止漏洞代码进入生产环境
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 构建前端
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e-test:
    name: 端到端测试
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 安装依赖
        run: npm ci

      - name: 构建项目
        run: npm run build

      - name: 安装 Playwright 浏览器
        run: npx playwright install chromium --with-deps

      - name: 运行 E2E 测试
        run: npm run test:e2e
        timeout-minutes: 5

      - name: 上传测试报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  security-scan:
    name: 安全扫描
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 安装前端依赖
        run: npm ci

      - name: 前端安全审计
        run: npm audit --audit-level=high

      - name: 安装后端依赖
        working-directory: ./server
        run: npm ci

      - name: 后端安全审计
        working-directory: ./server
        run: npm audit --audit-level=high

      - name: 运行 Snyk 扫描
        uses: snyk/actions/node@master
        if: env.SNYK_TOKEN != ''
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Snyk 未配置提示
        if: env.SNYK_TOKEN == ''
        run: echo "⚠️ SNYK_TOKEN 未配置，跳过 Snyk 扫描"

  notify:
    name: 通知
    runs-on: ubuntu-latest
    needs: [lint, test-frontend, test-backend, build, security-scan]
    if: always()
    steps:
      - name: 检查测试结果
        run: |
          LINT="${{ needs.lint.result }}"
          FE="${{ needs.test-frontend.result }}"
          BE="${{ needs.test-backend.result }}"
          BUILD="${{ needs.build.result }}"
          SECURITY="${{ needs.security-scan.result }}"

          echo "lint: $LINT"
          echo "frontend: $FE"
          echo "backend: $BE"
          echo "build: $BUILD"
          echo "security: $SECURITY"

          FAILED=0

          if [ "$LINT" != "success" ]; then
            echo "❌ 代码检查失败"
            FAILED=1
          fi

          if [ "$FE" != "success" ]; then
            echo "❌ 前端测试失败"
            FAILED=1
          fi

          if [ "$BE" != "success" ]; then
            echo "❌ 后端测试失败"
            FAILED=1
          fi

          if [ "$BUILD" != "success" ] && [ "$BUILD" != "skipped" ]; then
            echo "❌ 构建失败"
            FAILED=1
          fi

          if [ "$SECURITY" != "success" ] && [ "$SECURITY" != "skipped" ]; then
            echo "❌ 安全扫描失败"
            FAILED=1
          fi

          if [ "$FAILED" = "1" ]; then
            exit 1
          fi

          echo "✅ 所有核心检查通过！"
